server:
  port: 8123
  servlet:
    context-path: /api
  tomcat:
    connection-timeout: 300000  # 连接超时5分钟
    threads:
      max: 200  # 最大线程数
      min-spare: 10  # 最小空闲线程数
spring:
  application:
    name: clothingPattern-backend
  # Session 配置（30天超时，使用 Redis 持久化）
  session:
    store-type: redis
    timeout: 2592000s  # 单位：秒，2592000秒 = 30天
    redis:
      flush-mode: on_save
      namespace: spring:session
    cookie:
      max-age: 2592000  # Cookie 有效期 30天
      http-only: true   # 防止XSS攻击
      same-site: lax    # CSRF 保护
      secure: false     # 开发环境使用 http，生产环境改为 true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xhs_clothingPattern_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
#    url: jdbc:mysql://localhost:3306/xhs_clothingpattern_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
#    password: 2a8c324810b4c260
  # Redis 配置
  data:
    redis:
      database: 0
      host: 127.0.0.1
      port: 6379
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    local-cache-scope: statement  # 禁用一级缓存，避免读取到旧数据
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:com/xhs/mapper/*.xml  # 指定 Mapper XML 文件位置
knife4j:
  enable: true
  openapi:
    title: "接口文档"
    version: "1.0.0"
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.xhs.clothingptternbackend.controller
