<style>
  .favicon-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    margin-top: 22px;
  }
  .favicon-card {
    border: 1px solid #e8e4dc;
    border-radius: 14px;
    background: #fff;
    overflow: hidden;
    cursor: pointer;
    transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .favicon-card:hover {
    border-color: #7c6b59;
    box-shadow: 0 16px 36px rgba(45, 35, 25, .12);
    transform: translateY(-2px);
  }
  .favicon-stage {
    min-height: 210px;
    display: grid;
    place-items: center;
    background:
      linear-gradient(45deg, #f5f3ef 25%, transparent 25%),
      linear-gradient(-45deg, #f5f3ef 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f5f3ef 75%),
      linear-gradient(-45deg, transparent 75%, #f5f3ef 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
  }
  .favicon-preview {
    width: 116px;
    height: 116px;
    border-radius: 24px;
    box-shadow: 0 18px 40px rgba(37, 28, 20, .16);
  }
  .tiny-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 0;
  }
  .tiny-row svg {
    flex: 0 0 auto;
    box-shadow: 0 4px 10px rgba(37, 28, 20, .12);
  }
  .tiny-label {
    color: #6c6258;
    font-size: 13px;
  }
  .favicon-body {
    padding: 14px 16px 18px;
  }
  .favicon-body h3 {
    margin: 0 0 7px;
  }
  .favicon-body p {
    margin: 0;
    color: #6c6258;
    line-height: 1.5;
  }
  @media (max-width: 900px) {
    .favicon-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
